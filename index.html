<script>
var uaFull = navigator.userAgent;
var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
var isPS4 = match !== null;
var fwVersion = isPS4 ? match[1] : "Unknown";
var fwNum = parseFloat(fwVersion);

function onScriptError() {
    msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
}

if (!isPS4) {
    document.addEventListener("DOMContentLoaded", () => {
        msgs.innerHTML = "Only for PS4 with Firmware 11.50 to 14.00";
    });
} else {
    if (window.applicationCache.status == '0') {
         if (fwNum >= 11.50 && fwNum <= 14.00) {
            window.location.replace("cacheslopkit.html");
        } else {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
            });
        }
    } else {
            if (fwNum >= 11.50 && fwNum <= 12.02) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_lapse.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 12.50 && fwNum <= 13.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/chain_poops.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
        else if (fwNum >= 13.02 && fwNum <= 13.52) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb.js?v=19";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
		else if (fwNum == 14.00) {
            var script = document.createElement('script');
            script.type = 'module';
            script.src = "slopkit/jb2.js";
            script.onerror = onScriptError;
            document.head.appendChild(script);
        }
    }
}
</script>

<div class="loader-wrapper"> <!-- شريط التحميل --> 
    <div class="top-loading-container" id="loading-container"> 
        <div class="top-loading-bar" id="loading-bar"></div> 
    </div> 
    <!-- حاوية النتيجة --> 
    <div id="loading-result" class="result-message"></div> 
</div> 

<style> 
/* الحاوية الرئيسية لتثبيت العناصر في أعلى المنتصف */ 
.loader-wrapper { 
    position: fixed; 
    top: 80px; 
    left: 50%; 
    transform: translateX(-50%); 
    z-index: 9999; 
    text-align: center; 
    font-family: sans-serif; 
} 
/* حاوية شريط التحميل */ 
.top-loading-container { 
    width: 200px; 
    height: 4px; 
    background-color: #313030; 
    overflow: hidden; 
    border-radius: 2px; 
    transition: opacity 0.3s ease, transform 0.3s ease; 
} 
/* شريط التحميل الداخلي */ 
.top-loading-bar { 
    width: 100%; 
    height: 100%; 
    background-color: #1ccb88; 
    animation: progressLoader 20s ease-out forwards; 
} 
/* التنسيق العام لرسالة النتيجة */ 
.result-message { 
    font-size: 25px; 
    font-weight: bold; 
    margin-top: 10px; 
    opacity: 0; 
    transform: translateY(-10px); 
    transition: opacity 0.4s ease, transform 0.4s ease; 
} 
/* تنسيق خاص في حال النجاح (أخضر) */ 
.result-message.success {
    text-shadow: 0.1em 0.1em 0.2em rgb(11, 11, 11);  
    color: #1ccb88; 
    opacity: 1; 
    transform: translateY(0); 
} 
/* تنسيق خاص في حال الفشل (أحمر) */ 
.result-message.fail { 
    text-shadow: 0.1em 0.1em 0.2em rgb(11, 11, 11);
    color: #f20202; 
    opacity: 1; 
    transform: translateY(0); 
} 
/* حركة التعبئة من اليسار لليمين */ 
@keyframes progressLoader { 
    0% { transform: translateX(-100%); } 
    100% { transform: translateX(0%); } 
} 
</style> 

<script> 
const resultElement = document.getElementById("loading-result"); 
const containerElement = document.getElementById("loading-container"); 
const barElement = document.getElementById("loading-bar"); 
let isFinished = false; 

// دالة إخفاء شريط التحميل بشكل ناعم 
function hideLoader() { 
    containerElement.style.opacity = '0'; 
    containerElement.style.transform = 'scaleY(0)'; 
    barElement.style.animationPlayState = 'paused'; 
    setTimeout(() => { 
        containerElement.style.display = 'none'; 
    }, 300); 
} 

// دالة إظهار الفشل 
function triggerFailure() { 
    if (isFinished) return; 
    isFinished = true; 
    hideLoader(); 
    resultElement.textContent = "فشل تفعيل جولد هين... أعد تشغيل البلايستيشن وحاول مرة أخرى"; 
    resultElement.classList.add("fail"); 
    observer.disconnect(); 
} 

// دالة إظهار النجاح اللحظي 
function triggerSuccess() { 
    if (isFinished) return; 
    isFinished = true; 
    hideLoader(); 
    resultElement.textContent = "تم تفعيل جولد هين بنجاح! يمكنك الآن إغلاق المتصفح"; 
    resultElement.classList.add("success"); 
    observer.disconnect(); 
} 

// دالة لفحص محتوى الصفحة والبحث عن الكلمات المفتاحية 
function checkPageText() { 
    const pageText = (document.body.innerText || document.body.textContent).toLowerCase(); 

    // الفحص عن الفشل 
    if (pageText.includes("restart your console")) { 
        triggerFailure(); 
        return true; 
    } 

    // الفحص عن النجاح بالكلمة الجديدة "loaded"
    if (pageText.includes("loaded")) { 
        triggerSuccess(); 
        return true; 
    } 
    return false; 
} 

// مراقبة الصفحة لحظياً فور حدوث أي تغيير في النصوص 
const observer = new MutationObserver((mutations) => { 
    for (let mutation of mutations) { 
        if (mutation.type === 'childList' || mutation.type === 'characterData') { 
            if (checkPageText()) break; 
        } 
    } 
}); 

// بدء مراقبة التغييرات 
observer.observe(document.body, { childList: true, subtree: true, characterData: true }); 

// فحص أولي سريع عند تشغيل الكود مباشرة 
checkPageText(); 
</script>
